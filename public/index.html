<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover + kein Zoom: als Home-Bildschirm-App soll sich das Dashboard wie
         eine native App anfühlen (kein versehentliches Reinzoomen beim schnellen Tippen). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>YAMI Dashboard</title>

    <!-- PWA: "Zum Home-Bildschirm" auf iPhone/Android öffnet die App ohne Browserleiste. -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#f7f5f2" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="YAMI" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
        /* Kein Gummiband-Scrollen / Pull-to-refresh, das die ganze App verschiebt. */
        overscroll-behavior: none;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <div id="root"></div>
  </body>
</html>
